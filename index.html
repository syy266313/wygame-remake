<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0e14">
<title>反抗之战 · 重制版</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0c0e14;color:#e6e9f0;overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none}
  #app{max-width:680px;width:100%;margin:0 auto;padding:0 10px 92px;position:relative}

  header{position:sticky;top:0;z-index:8;background:linear-gradient(180deg,#0c0e14 72%,rgba(12,14,20,0));
    padding:10px 2px 12px}
  .brandline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .brand{font-size:19px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(92deg,#18e0c8,#7ad4ff 40%,#ff5a6e);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{font-size:10px;letter-spacing:1px;color:#5b6478;font-weight:600}
  .speed{display:flex;gap:5px}
  .speed button{background:#151a24;border:1px solid #232a38;color:#7d8798;
    border-radius:8px;font-size:12px;padding:5px 9px;font-weight:700}
  .speed button.on{background:#18e0c8;color:#062521;border-color:#18e0c8}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
  .stat{background:#11151d;border:1px solid #1d2431;border-radius:10px;padding:7px 8px;min-width:0;overflow:hidden}
  .stat i{display:block;font-style:normal;font-size:10px;color:#687285;letter-spacing:.5px}
  .stat b{display:block;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums;color:#d8e0ee;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.warn b{color:#ff7a6e}
  .stat.good b{color:#18e0c8}

  main{margin-top:2px}
  #map{width:100%;display:block;border-radius:14px;background:#0a0d12;
    border:1px solid #1b2230;box-shadow:0 6px 30px rgba(0,0,0,.5) inset}

  .pb{margin:10px 2px 0}
  .pbtrack{height:16px;border-radius:9px;background:#1a1013;position:relative;overflow:hidden;
    border:1px solid #2a1a1e}
  #pbfill{position:absolute;inset:0 auto 0 0;width:33%;
    background:linear-gradient(90deg,#12c9b6,#38e0ff);transition:width .12s linear;
    box-shadow:0 0 18px rgba(24,224,200,.35)}
  .pbmark{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffffff22}
  .pblabels{display:flex;justify-content:space-between;font-size:11px;color:#6d7789;margin-top:6px;
    font-variant-numeric:tabular-nums}
  #ratioTxt{color:#9aa5b8}

  .sec{margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  .sec h2{font-size:12px;letter-spacing:2px;color:#5d6779;margin:0;font-weight:700}
  .sec .line{flex:1;height:1px;background:linear-gradient(90deg,#1f2734,transparent)}

  .ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .op{background:#11151d;border:1px solid #1e2532;border-radius:12px;padding:10px 11px;min-width:0;
    display:flex;flex-direction:column;gap:5px;transition:.12s;user-select:none}
  .op:active{transform:scale(.98)}
  .op.can{border-color:#1f6b62;background:#0f1a1d}
  .op.can:active{background:#12241f}
  .op.dis{opacity:.42}
  .op .top{display:flex;align-items:center;justify-content:space-between}
  .op .nm{font-size:13px;font-weight:700;color:#cfd7e4}
  .op .lv{font-size:10px;color:#18e0c8;background:#0e2321;border-radius:5px;padding:2px 6px;font-weight:700}
  .op .ds{font-size:10.5px;color:#7b8698;line-height:1.45;min-height:26px;overflow:hidden}
  .op .cs{font-size:12.5px;font-weight:700;color:#ffc65c;font-variant-numeric:tabular-nums}
  .op.can .cs{color:#ffe08a}
  .op.dis .cs{color:#6a6151}

  .log{margin-top:12px;background:#0f131a;border:1px solid #1a202b;border-radius:12px;
    padding:8px 10px;height:78px;overflow:hidden;display:flex;flex-direction:column-reverse;gap:3px}
  .log span{font-size:11.5px;line-height:1.5;color:#7e8a9d;display:block}
  .log span.bad{color:#ff7a6e}
  .log span.good{color:#18e0c8}
  .log span.go{color:#ffd166}
  .log span.dim{color:#4d5666}

  footer{position:fixed;left:0;right:0;bottom:0;z-index:9;
    background:linear-gradient(0deg,#0c0e14 78%,rgba(12,14,20,0));padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .fin{max-width:660px;margin:0 auto;display:flex;gap:8px}
  .fin button{flex:1;border-radius:12px;border:1px solid #232a38;background:#151a24;
    color:#c6cfdd;font-size:13px;font-weight:700;padding:13px 8px;letter-spacing:1px}
  #btnAssault{flex:1.6;border-color:#6b2540;
    background:linear-gradient(180deg,#3a1226,#1a0a13);color:#ff8fa3}
  #btnAssault.cd{opacity:.5}

  #over{position:fixed;inset:0;z-index:20;background:rgba(6,8,12,.82);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #over.hide{display:none}
  .card{max-width:340px;width:100%;text-align:center;background:#11151d;
    border:1px solid #26303f;border-radius:18px;padding:26px 22px}
  .card h3{margin:0;font-size:26px;letter-spacing:4px}
  .card .sub{color:#77839a;font-size:12px;margin-top:8px;line-height:1.7}
  .card .big{font-size:13px;color:#ffd166;margin-top:14px;font-variant-numeric:tabular-nums}
  .card button{margin-top:20px;width:100%;padding:13px;border-radius:12px;border:0;
    background:#18e0c8;color:#052421;font-weight:800;letter-spacing:2px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brandline">
      <div class="brand">反抗之战 <small>REMAKE 2.0</small></div>
      <div class="speed" id="speed">
        <button data-sp="0">❚❚</button>
        <button data-sp="1" class="on">1×</button>
        <button data-sp="2">2×</button>
        <button data-sp="4">4×</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><i>资金</i><b id="sMoney">0</b></div>
      <div class="stat" id="statFollow"><i>追随者</i><b id="sFollow">0</b></div>
      <div class="stat" id="statStealth"><i>隐蔽度</i><b id="sStealth">0</b></div>
      <div class="stat"><i>时间</i><b id="sClock">0:00</b></div>
    </div>
  </header>

  <main>
    <canvas id="map"></canvas>

    <div class="pb">
      <div class="pbtrack">
        <div id="pbfill"></div>
        <div class="pbmark" style="left:14.3%"></div>
        <div class="pbmark" style="left:85.7%"></div>
      </div>
      <div class="pblabels">
        <span id="pl">民众 0%</span>
        <span id="ratioTxt">6:1</span>
        <span id="gl">政府 0%</span>
      </div>
    </div>

    <div class="sec"><h2>局势</h2><div class="line"></div></div>
    <div class="log" id="log"></div>

    <div class="sec"><h2>组织</h2><div class="line"></div></div>
    <div class="ops" id="ops"></div>
  </main>

  <footer>
    <div class="fin">
      <button id="btnAssault">总攻</button>
      <button id="btnReset">重新开始</button>
    </div>
  </footer>
</div>

<div id="over" class="hide">
  <div class="card">
    <h3 id="ovTitle">胜利</h3>
    <div class="sub" id="ovSub"></div>
    <div class="big" id="ovStats"></div>
    <button id="ovBtn">再来一局</button>
  </div>
</div>

<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
